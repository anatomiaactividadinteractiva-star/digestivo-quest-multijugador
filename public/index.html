<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digestivo Quest · Competencia</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#123b62;background:#edf5ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.head{background:linear-gradient(110deg,#073e83,#1487cb);color:white;padding:22px;border-radius:0 0 24px 24px}.head h1{margin:0;font-size:clamp(23px,4vw,36px)}.head p{margin:5px 0 0}.card{background:white;border:1px solid #cbdff1;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 22px #123b6210}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.btn{border:0;background:#0866bd;color:white;border-radius:12px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer;min-height:48px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:#e2f1ff;color:#07467f}.btn.red{background:#cc3652}.btn.green{background:#19825b}.btn.big{font-size:24px;padding:25px;width:100%;border-radius:22px;background:#e82c4d}.btn.wide{width:100%}input{font:inherit;padding:12px;border:2px solid #b9d6ef;border-radius:10px;max-width:100%;width:100%}label{display:block;font-weight:650;margin:10px 0}.muted{color:#55738d}.hidden{display:none!important}.pill{display:inline-block;background:#dceeff;border-radius:50px;padding:6px 12px;font-weight:700}.timer{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}.question{font-size:clamp(18px,2.6vw,26px);font-weight:750}.anatomy{max-width:100%;max-height:380px;object-fit:contain;display:block;margin:16px auto;border-radius:12px}.option{display:block;width:100%;text-align:left;background:#f4f9ff;color:#153e67;border:2px solid #c6dcf0;padding:14px;margin:8px 0;border-radius:12px;font:inherit;cursor:pointer}.option.selected{background:#cbe8ff;border-color:#1273c8}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #e0ebf5;padding:10px 0}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pairs button{min-height:60px}.answer{background:#e6f7ee;border-left:5px solid #22966a;padding:15px;border-radius:10px}.error{background:#ffe9eb;color:#9e263f;padding:10px;border-radius:8px}.item{padding:12px;background:#f3f8ff;border:1px solid #bdd5ec;border-radius:10px;margin:7px 0;display:flex;gap:8px;align-items:center}.item span{flex:1}.mini{padding:6px 12px}.status{font-weight:700}.small{font-size:13px}@media(max-width:650px){.wrap{padding:12px}.card{padding:14px}}
</style></head><body><header class="head"><div class="wrap"><h1>🦈 Digestivo Quest</h1><p>Morfofisiología · Unidad IX · Competencia multijugador</p></div></header><main class="wrap"><section id="entry" class="grid"><div class="card"><h2>👨‍🏫 Docente</h2><label>Duración de la competencia (minutos)<input id="minutes" type="number" min="1" max="240" value="45"></label><button class="btn wide" onclick="create()">Crear sala</button></div><div class="card"><h2>📱 Estudiante</h2><label>Código de sala<input id="roomCode" inputmode="numeric" maxlength="6" placeholder="Ej. 123456"></label><label>Nombre o apodo<input id="playerName" maxlength="32" placeholder="Tu nombre"></label><button class="btn wide" onclick="join()">Entrar a la sala</button></div></section><section id="game" class="hidden"><div class="card"><div class="row"><div><span class="pill" id="roleLabel"></span> <span class="pill">Sala: <strong id="codeLabel"></strong></span></div><div class="timer" id="timer">--:--</div></div><p class="status" id="status">Conectando...</p><p class="muted small" id="connection"></p></div><div class="grid"><div><div class="card"><div class="row"><strong id="counter">Laminario</strong><span class="pill" id="topic">Unidad IX</span></div><h2 id="qTitle"></h2><p class="question" id="qPrompt"></p><img class="anatomy hidden" id="qImage" alt="Imagen anatómica de la presentación"><div id="activity"></div><div id="feedback"></div></div><div class="card" id="controls"></div></div><aside><div class="card"><h3>🏆 Clasificación en vivo</h3><div id="leaderboard"></div></div><div class="card"><h3>📋 Cómo participar</h3><p class="muted" id="help">El docente inicia la ronda. Pulsa primero para obtener el turno y responde en tu celular.</p></div></aside></div></section><div id="toast" class="error hidden"></div></main><script>
let socket,role='',room='',token='',state=null,selected=null,pairings={},order=[],solution=null,answerSent=false,joinName='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function warn(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),5000)}
function connect(cb){const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}`);socket.onopen=cb;socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')return warn(m.message);if(m.type==='created'){room=m.code;token=m.token;sessionStorage.setItem('dqHost',JSON.stringify({room,token}));enter('host')}if(m.type==='joined'){room=m.code;token=m.token;sessionStorage.setItem('dqPid',m.id);sessionStorage.setItem('dqPlayer',JSON.stringify({room,token,name:joinName}));enter('player')}if(m.type==='state'){const old=state;state=m;if(!old||old.index!==m.index||old.stage==='reveal'&&m.stage==='waiting'){selected=null;pairings={};order=[];solution=null;answerSent=false}render()}if(m.type==='yourTurn'){answerSent=false;render()}if(m.type==='feedback'){if(!m.correct)warn('Respuesta incorrecta. El turno pasa a los demás participantes.');else warn('¡Correcto! +'+m.points+' puntos')}if(m.type==='solution'){solution=m;render()}};socket.onclose=()=>{$('connection').textContent='Sin conexión. Recarga la página para intentar reconectar.'};socket.onerror=()=>warn('No se pudo conectar al servidor. Abre esta página desde la dirección del servidor, no como archivo local.')}
function send(type,rest={}){if(socket?.readyState===1)socket.send(JSON.stringify({type,...rest}))}
function create(){role='host';connect(()=>send('create',{minutes:Number($('minutes').value)}))}
function join(){joinName=$('playerName').value.trim();const code=$('roomCode').value.trim();if(!joinName||!/^\d{6}$/.test(code))return warn('Escribe tu nombre y un código de seis dígitos');role='player';connect(()=>send('join',{code,name:joinName}))}
function enter(r){role=r;$('entry').classList.add('hidden');$('game').classList.remove('hidden');$('roleLabel').textContent=r==='host'?'Panel docente':'Jugador: '+joinName;$('codeLabel').textContent=room}
function btn(text,cmd,kind=''){return `<button class="btn ${kind}" onclick="${cmd}">${esc(text)}</button>`}
function render(){if(!state)return;const q=state.question;const me=state.players.find(p=>p.id===sessionStorage.getItem('dqPid'));$('codeLabel').textContent=state.code;$('counter').textContent=`Laminario ${state.index+1} de ${state.total}`;$('topic').textContent=['Faringe','Esófago','Cavidad abdominal'][q.c];$('qTitle').textContent=q.title;$('qPrompt').textContent=q.prompt;$('qImage').classList.toggle('hidden',!q.imageUrl);if(q.imageUrl)$('qImage').src=q.imageUrl;$('leaderboard').innerHTML=state.players.map((p,i)=>`<div class="leader"><span>${i+1}. ${esc(p.name)}</span><b>${p.points} pts</b></div>`).join('')||'<p class="muted">Esperando estudiantes...</p>';
 const label={waiting:'Preparando laminario',buzz:'¡Pulsadores abiertos!',answering:`Turno de ${state.current||'un participante'}`,reveal:'Respuesta correcta revelada',finished:'Competencia terminada'};$('status').textContent=label[state.stage]||state.stage;$('connection').textContent=state.hostConnected?'Docente conectado':'Docente desconectado';$('feedback').innerHTML=state.stage==='reveal'||state.stage==='finished'?solution?`<div class="answer"><b>Respuesta correcta</b><p>${renderSolution(solution.answer)}</p><p>${esc(solution.explanation)}</p></div>`:'<p class="muted">Esperando solución...</p>':'';
 if(role==='host'){$('activity').innerHTML='<p class="muted">Los estudiantes responden desde sus celulares. El docente controla la apertura, la revelación y el cambio de laminario.</p>';$('controls').innerHTML='<h3>Control docente</h3>'+ (state.stage==='waiting'?btn(state.deadline?'Abrir pulsadores':'Iniciar competencia y abrir pulsadores','startRound()','wide'):'')+(state.stage==='buzz'||state.stage==='answering'?btn('Revelar respuesta y cerrar ronda','send("reveal")','alt wide'):'')+(state.stage==='reveal'?btn('Siguiente laminario','send("next")','green wide'):'')+(state.deadline?btn('Pausar reloj','send("pause")','alt'):state.remaining>0?btn('Reanudar reloj','send("resume")','alt'):'')+(state.stage!=='finished'?btn('Finalizar competencia','if(confirm("¿Finalizar la competencia?"))send("finish")','red'):'');}
 else{const myId=sessionStorage.getItem('dqPid');const excluded=state.excluded.includes(myId);const mine=state.current&&state.current===state.players.find(p=>p.id===myId)?.name;$('controls').innerHTML='<h3>Tu pulsador</h3>'+(state.stage==='buzz'&&!excluded?btn('🔴 ¡PULSAR!','send("buzz")','big'):'<p class="muted">'+(excluded?'Ya participaste en esta ronda. Espera la siguiente.':state.stage==='answering'?'Pulsadores bloqueados durante la respuesta.':'Espera a que el docente abra los pulsadores.')+'</p>');$('activity').innerHTML=state.stage==='answering'&&mine&&!answerSent?renderActivity(q):'<p class="muted">'+(state.stage==='reveal'?'Consulta la solución antes de la siguiente pregunta.':state.stage==='answering'?'Otro jugador está respondiendo.':'Pulsa primero para recibir el turno de respuesta.')+'</p>'}
 updateTimer()}
function startRound(){send('start')}
function renderSolution(a){if(typeof a==='string')return esc(a);if(Array.isArray(a))return a.map(x=>typeof x==='string'?esc(x):esc(x.left)+' → '+esc(x.right)).join('<br>');return esc(a)}
function renderActivity(q){if(q.type==='quiz')return '<p>Selecciona una opción:</p>'+q.options.map(o=>`<button class="option ${selected===o.id?'selected':''}" onclick="choose('${o.id}')">${esc(o.text)}</button>`).join('')+btn('Enviar respuesta','submitAnswer()',selected===null?'alt wide':'green wide');if(q.type==='order'){if(!order.length)order=q.items.map(x=>x.id);return '<p>Ordena utilizando las flechas:</p>'+order.map((id,i)=>{const x=q.items.find(v=>v.id===id);return `<div class="item"><span>${esc(x.text)}</span><button class="btn mini alt" onclick="move(${i},-1)">↑</button><button class="btn mini alt" onclick="move(${i},1)">↓</button></div>`}).join('')+btn('Enviar orden','submitAnswer()','green wide')}
 const left=q.left,right=q.right;return '<p>Une cada estructura con su correspondencia:</p><div class="pairs"><div>'+left.map(x=>`<button class="option ${selected===x.id?'selected':''}" onclick="selectLeft('${x.id}')">${esc(x.text)} ${pairings[x.id]!==undefined?'✓':''}</button>`).join('')+'</div><div>'+right.map(x=>`<button class="option" onclick="selectRight('${x.id}')">${esc(x.text)}</button>`).join('')+'</div></div><p class="muted small">Selecciona primero la izquierda y después la derecha. Pares: '+Object.keys(pairings).length+'/'+left.length+'</p>'+btn('Enviar correspondencias','submitAnswer()','green wide')}
function choose(i){selected=i;render()}function move(i,d){const j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];render()}function selectLeft(i){selected=i;render()}function selectRight(i){if(selected===null)return;for(const k of Object.keys(pairings))if(pairings[k]===i)delete pairings[k];pairings[selected]=i;selected=null;render()}
function submitAnswer(){if(answerSent||!state||state.stage!=='answering')return;const q=state.question;let answer;if(q.type==='quiz'){if(selected===null)return warn('Selecciona una respuesta');answer=selected}else if(q.type==='order')answer=order;else{if(Object.keys(pairings).length!==q.left.length)return warn('Completa todas las correspondencias');answer=q.left.map(x=>pairings[x.id])}answerSent=true;send('answer',{answer});$('activity').innerHTML='<p class="muted">Respuesta enviada. Esperando corrección...</p>'}
function updateTimer(){if(!state)return;const seconds=state.deadline?Math.max(0,Math.ceil((state.deadline-Date.now())/1000)):state.remaining??state.seconds;const mm=Math.floor(seconds/60),ss=seconds%60;$('timer').textContent=`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
setInterval(updateTimer,300);
const hp=sessionStorage.getItem('dqHost'),pp=sessionStorage.getItem('dqPlayer');if(hp){try{const x=JSON.parse(hp);room=x.room;token=x.token;role='host';connect(()=>send('hostReconnect',x));enter('host')}catch{}}else if(pp){try{const x=JSON.parse(pp);room=x.room;token=x.token;joinName=x.name;role='player';connect(()=>send('join',{code:room,name:joinName,token}));enter('player')}catch{}}
</script></body></html>
